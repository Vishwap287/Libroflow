<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fines · LibroFlow Library Manager</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="user/css/portal.css" />
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="img/logo.png" alt="LibroFlow" class="brand-logo" />
      <div>
        <div class="name">LibroFlow</div>
        <div class="sub">LIBRARY MANAGER</div>
      </div>
    </div>

    <div class="nav-section-label">Overview</div>
    <a href="dashboard.html" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      Dashboard
    </a>

    <div class="nav-section-label">Catalog</div>
    <a href="books.html" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      Books
    </a>
    <a href="members.html" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Members
    </a>
    <a href="transactions.html" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      Issue / Return
    </a>

    <div class="nav-section-label">Member Portal</div>
    <a href="manage-fines.html" class="nav-link active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      Fines
    </a>

    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="avatar" data-user-avatar>A</div>
        <div class="who">
          <div class="n" data-user-name>—</div>
          <div class="r" data-user-role>—</div>
        </div>
      </div>
      <button class="logout-btn" data-logout>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign out
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>Member Fines</h1>
        <div class="subtitle">View fines across all members and log new ones</div>
      </div>
      <div class="flex-row">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="searchInput" placeholder="Search by date or amount…" />
        </div>
        <button class="btn btn-primary" id="logFineBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Log a fine
        </button>
      </div>
    </div>

    <div class="flex-row" style="margin-bottom:16px; gap:8px;">
      <button class="btn btn-secondary btn-sm" data-filter="ALL">All</button>
      <button class="btn btn-secondary btn-sm" data-filter="UNPAID">Unpaid</button>
      <button class="btn btn-secondary btn-sm" data-filter="PAID">Paid</button>
    </div>

    <div class="panel">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Member</th>
              <th>Book</th>
              <th>Issued</th>
              <th>Due</th>
              <th>Returned</th>
              <th>Overdue days</th>
              <th>Fine amount</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="finesBody">
            <tr class="empty-row"><td colspan="8">Loading fines…</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination" id="pagination" style="display:none;">
        <div class="info" id="pageInfo"></div>
        <div class="controls" id="pageControls"></div>
      </div>
    </div>
  </main>
</div>

<!-- Log a Fine Modal -->
<div class="modal-overlay" id="logFineModal" style="display:none;">
  <div class="modal">
    <div class="modal-header">
      <h3>Log a fine for a member</h3>
      <button class="btn btn-ghost btn-sm" id="closeLogFineModal">✕</button>
    </div>
    <div class="modal-body">
      <form id="logFineForm">
        <div class="form-grid">
          <div class="form-field full">
            <label for="memberSelect">Member</label>
            <select id="memberSelect" required>
              <option value="">Select a member…</option>
            </select>
          </div>
          <div class="form-field">
            <label for="issueDate">Issue date</label>
            <input type="date" id="issueDate" required />
          </div>
          <div class="form-field">
            <label for="dueDate">Due date</label>
            <input type="date" id="dueDate" required />
          </div>
          <div class="form-field full">
            <label for="returnDate">Return date (leave blank if not yet returned)</label>
            <input type="date" id="returnDate" />
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="cancelLogFineBtn">Cancel</button>
      <button class="btn btn-primary" id="saveLogFineBtn">Log fine</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/manage-fines.js"></script>
</body>
</html>
