<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot password · LibroFlow</title>
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="css/portal.css" />
</head>
<body>

<div class="login-shell">

  <div class="login-visual">
    <div class="catalog-card" style="width:120px;height:160px;top:60px;right:90px;transform:rotate(8deg);"></div>
    <div class="catalog-card" style="width:120px;height:160px;top:120px;right:150px;transform:rotate(-6deg);"></div>
    <div class="catalog-card" style="width:120px;height:160px;bottom:70px;right:60px;transform:rotate(-3deg);"></div>

    <img src="../img/logo.png" alt="LibroFlow" style="width:52px; height:52px; border-radius:14px; object-fit:cover; margin-bottom:20px; box-shadow:0 8px 24px rgba(0,0,0,0.3); background:white;" />
    <h2>Locked out? Let's get you back in.</h2>
    <p>Verify your identity with the email and phone number on your account, then choose a new password.</p>
  </div>

  <div class="login-form-side">
    <div class="login-card">
      <img src="../img/logo.png" alt="LibroFlow" class="login-mobile-logo" />
      <h1>Reset your password</h1>
      <p class="lede">Confirm your details to set a new password.</p>

      <div class="login-error" id="resetError"></div>
      <div class="demo-hint" id="resetSuccess" style="display:none; background:var(--teal-soft); color:var(--teal-dark); border-color:transparent; margin-bottom:16px;"></div>

      <form id="resetForm">
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="username" required />
        </div>
        <div class="form-field">
          <label for="phone">Phone number on file</label>
          <input type="text" id="phone" placeholder="e.g. 9876543210" autocomplete="tel" required />
        </div>
        <div class="form-field">
          <label for="newPassword">New password</label>
          <input type="password" id="newPassword" placeholder="At least 6 characters" autocomplete="new-password" required minlength="6" />
        </div>
        <div class="form-field">
          <label for="confirmPassword">Confirm new password</label>
          <input type="password" id="confirmPassword" placeholder="Re-enter new password" autocomplete="new-password" required minlength="6" />
        </div>

        <button type="submit" class="btn btn-primary" id="resetBtn">Reset password</button>
      </form>

      <div class="demo-hint" style="text-align:center; margin-top:16px;">
        <a href="login.html" style="color:var(--teal-dark); font-weight:600;">← Back to sign in</a>
      </div>
    </div>
  </div>

</div>

<script src="js/portal.js"></script>
<script>
  const form = document.getElementById("resetForm");
  const errorBox = document.getElementById("resetError");
  const successBox = document.getElementById("resetSuccess");
  const resetBtn = document.getElementById("resetBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.style.display = "none";
    successBox.style.display = "none";

    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (newPassword !== confirmPassword) {
      errorBox.textContent = "Passwords do not match.";
      errorBox.style.display = "block";
      return;
    }

    resetBtn.disabled = true;
    resetBtn.textContent = "Resetting...";

    try {
      const response = await fetch(PORTAL_API_BASE_URL + "/auth/forgot-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, phone, newPassword }),
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.message || "Could not reset password");
      }

      successBox.textContent = data.message || "Password reset successfully. You can now sign in.";
      successBox.style.display = "block";
      form.reset();
    } catch (err) {
      errorBox.textContent = err.message || "Unable to reset password. Please check your connection to the server.";
      errorBox.style.display = "block";
    } finally {
      resetBtn.disabled = false;
      resetBtn.textContent = "Reset password";
    }
  });
</script>

</body>
</html>
