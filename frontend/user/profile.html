<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Profile · LibroFlow</title>
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="css/portal.css" />
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="../img/logo.png" alt="LibroFlow" class="brand-logo" />
      <div>
        <div class="name">LibroFlow</div>
        <div class="sub">MEMBER PORTAL</div>
      </div>
    </div>

    <div class="nav-section-label">My account</div>
    <a href="dashboard.html" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      Dashboard
    </a>
    <a href="catalog.html" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      Book Catalog
    </a>
    <a href="profile.html" class="nav-link active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      My Profile
    </a>
    <a href="fines.html" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      My Fines
    </a>

    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="avatar" data-user-avatar>U</div>
        <div class="who">
          <div class="n" data-user-name>—</div>
          <div class="r">Member</div>
        </div>
      </div>
      <button class="logout-btn" data-logout>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign out
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>My Profile</h1>
        <div class="subtitle">View and manage your account details</div>
      </div>
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; align-items:start;">

      <div class="panel">
        <div class="panel-header">
          <h3>Profile information</h3>
          <button class="btn btn-secondary btn-sm" id="editProfileBtn">Edit</button>
        </div>
        <div class="panel-body" id="profileView">
          <div class="loading-row">Loading profile…</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h3>Change password</h3>
        </div>
        <div class="panel-body">
          <form id="passwordForm">
            <div class="form-field" style="margin-bottom:14px;">
              <label for="currentPassword">Current password</label>
              <input type="password" id="currentPassword" required />
            </div>
            <div class="form-field" style="margin-bottom:14px;">
              <label for="newPassword">New password</label>
              <input type="password" id="newPassword" required minlength="6" />
            </div>
            <div class="form-field" style="margin-bottom:18px;">
              <label for="confirmNewPassword">Confirm new password</label>
              <input type="password" id="confirmNewPassword" required minlength="6" />
            </div>
            <button type="submit" class="btn btn-primary" id="changePasswordBtn">Update password</button>
          </form>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- Edit Profile Modal -->
<div class="modal-overlay" id="editModal" style="display:none;">
  <div class="modal">
    <div class="modal-header">
      <h3>Edit profile</h3>
      <button class="btn btn-ghost btn-sm" id="closeEditModal">✕</button>
    </div>
    <div class="modal-body">
      <form id="editForm">
        <div class="form-grid">
          <div class="form-field full">
            <label for="editFullName">Full name</label>
            <input type="text" id="editFullName" required />
          </div>
          <div class="form-field">
            <label for="editPhone">Phone</label>
            <input type="text" id="editPhone" />
          </div>
          <div class="form-field">
            <label for="editDepartment">Department</label>
            <input type="text" id="editDepartment" />
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="cancelEditBtn">Cancel</button>
      <button class="btn btn-primary" id="saveEditBtn">Save changes</button>
    </div>
  </div>
</div>

<script src="js/portal.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
