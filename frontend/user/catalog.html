<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Book Catalog · LibroFlow</title>
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="css/portal.css" />
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="../img/logo.png" alt="LibroFlow" class="brand-logo" />
      <div>
        <div class="name">LibroFlow</div>
        <div class="sub">MEMBER PORTAL</div>
      </div>
    </div>

    <div class="nav-section-label">My account</div>
    <a href="dashboard.html" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      Dashboard
    </a>
    <a href="catalog.html" class="nav-link active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      Book Catalog
    </a>
    <a href="profile.html" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      My Profile
    </a>
    <a href="fines.html" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      My Fines
    </a>

    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="avatar" data-user-avatar>U</div>
        <div class="who">
          <div class="n" data-user-name>—</div>
          <div class="r">Member</div>
        </div>
      </div>
      <button class="logout-btn" data-logout>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign out
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>Book Catalog</h1>
        <div class="subtitle">Browse available titles and borrow one directly</div>
      </div>
      <div class="catalog-toolbar">
        <div class="category-select-wrap">
          <svg class="category-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 6h16M4 12h16M4 18h7"/>
          </svg>
          <select id="categorySelect" aria-label="Filter by category">
            <option value="ALL">All Categories</option>
          </select>
          <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>

        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="searchInput" placeholder="Search title, author, category…" />
        </div>
      </div>
    </div>

    <div class="catalog-status-bar" id="catalogStatusBar" style="display:none;">
      <span id="catalogCountLabel"></span>
      <button class="btn btn-ghost btn-xs" id="clearFilterBtn" type="button">Reset Filter ✕</button>
    </div>

    <div class="book-grid" id="catalogGrid">
      <div class="loading-row">Loading catalog…</div>
    </div>
  </main>
</div>

<!-- Issue confirmation modal -->
<div class="modal-overlay" id="issueModal" style="display:none;">
  <div class="modal">
    <div class="modal-header">
      <h3>Borrow this book?</h3>
      <button class="btn btn-ghost btn-sm" id="closeIssueModal">✕</button>
    </div>
    <div class="modal-body">
      <p id="issueModalBookInfo" style="margin-bottom:16px;"></p>
      <div class="form-field">
        <label for="loanDays">Loan period (days)</label>
        <input type="number" id="loanDays" value="14" min="1" max="90" />
        <span class="hint">A fine of ₹5/day applies for each day returned after the due date.</span>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="cancelIssueBtn">Cancel</button>
      <button class="btn btn-primary" id="confirmIssueBtn">Borrow book</button>
    </div>
  </div>
</div>

<script src="js/portal.js"></script>
<script src="js/catalog.js"></script>
</body>
</html>
