# ===================== Server =====================
server.port=${PORT:8080}

# ===================== MySQL Database =====================
# Create the database first:  CREATE DATABASE library_db;
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/library_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Vishwa89}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================== JPA / Hibernate =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Run data.sql (30 sample books) after Hibernate creates/updates the schema.
# data.sql uses INSERT IGNORE keyed on the unique isbn column, so this is
# safe to run on every startup - it won't create duplicates.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ===================== JWT =====================
# NOTE: change this secret before deploying to production
jwt.secret=${JWT_SECRET:ChangeThisSecretKeyToSomethingLongAndRandomForProductionUse1234567890}
jwt.expiration.ms=86400000

# ===================== Misc =====================
spring.jackson.serialization.write-dates-as-timestamps=false
