# ===================== Server =====================
server.port=${PORT:8080}

# ===================== MySQL Database (TiDB Cloud) =====================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://gateway01.ap-northeast-1.prod.aws.tidbcloud.com:4000/library_db?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3&createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:4QPHUFK5nLDbVsn.root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:C3IKFFYeZb9Pzk6V}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================== JPA / Hibernate =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Run data.sql (30 sample books) after Hibernate creates/updates the schema.
# data.sql uses INSERT IGNORE keyed on the unique isbn column, so this is
# safe to run on every startup - it won't create duplicates.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ===================== JWT =====================
# NOTE: change this secret before deploying to production
jwt.secret=${JWT_SECRET:ChangeThisSecretKeyToSomethingLongAndRandomForProductionUse1234567890}
jwt.expiration.ms=86400000

# ===================== Misc =====================
spring.jackson.serialization.write-dates-as-timestamps=false
